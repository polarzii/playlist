<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de espera</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="playlist">

        <header class="topo">
            <h1>Na fila</h1>
            <p class="contagem">3 músicas na fila</p>
        </header>

        <form class="cadastro">
            <h2>Comandos</h2>

            <p>
                <label for="nome">Música</label>
                <input type="text" id="nome" class="campo-nome">
            </p>

            <div class="botoes">
                <button type="submit" class="botao-adicionar-ao-fim">
                    Adicionar ao fim
                </button>

                <button type="button" class="botao-tocar-depois">
                    Tocar depois desta
                </button>

                <button type="button" class="botao-remover">
                    Remover da fila
                </button>

                <button type="button" class="botao-desfazer-ultima">
                    Desfazer última
                </button>
            </div>

            <p class="aviso"></p>
        </form>

        <section class="espera">
             <h2><img src="musica.png" width="80" alt="musica" class="logo">Tocando Agora </h2>

            <p class="musica-atual">Nada tocando</p>
            <button type="button" class="botao-chamar">
                Próxima
            </button>
        </section>

        <section class="chamada">
            <h2> <img src="play.png" width="40" alt="play" class="logo">A seguir</h2>
            <ol class="lista">
                <li class="musica">Hard drive</li>
                <li class="musica">Cemetery drive</li>
                <li class="musica">Helena</li>
            </ol>



    </main>

</body>

</html>

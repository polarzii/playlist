<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Playlist</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="playlist">

        <header class="topo">
            <h1>Playlist</h1>
            <p class="contagem"> Nenhma musica na fila</p>
        </header>

        <section class="cadastro">
            <h2>Adicionar música</h2>

            <form class="formulario">
                <p>
                    <label for="musica">Nome da música</label>
                    <input type="text" id="musica" class="campo-musica">
                </p>

                <button type="submit">Adicionar à fila</button>
            </form>

            <p class="aviso"></p>
        </section>

        <section class="fila">
            <h2>Fila de músicas</h2>
            <ol class="lista"></ol>
        </section>

        <section class="tocando">
            <h2> <img src="musica.png" width="50" height="30" alt="tocando agora">Tocando agora</h2>
            <p class="musica-atual">Nenhama musica tocando agora/p>

            <button type="button" class="botao-proxima">
                Próxima
            </button>

            <h3> <img src="play.png" width="30" height="30" alt="Descrição da imagem">Já tocou</h3>
            <ol class="lista-tocadas"></ol>
        </section>

    </main>

</body>

</html>
